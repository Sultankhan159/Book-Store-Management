name: CI/CD Pipeline & Cloud Packaging

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Job 1: Build & Automated Testing
  # ==========================================
  build-and-test:
    name: Build & Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Unit & Concurrency Tests
        run: ./mvnw clean test --no-transfer-progress

      - name: Package Application JAR
        run: ./mvnw package -DskipTests --no-transfer-progress

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-app-jar
          path: target/*.jar
          retention-days: 7

  # ==========================================
  # Job 2: Containerize & Verify Healthcheck
  # ==========================================
  docker-verification:
    name: Docker Build & Container Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: bookstore-management:ci-test
          load: true

      - name: Test Container Startup & Health Check
        run: |
          docker run -d --name bookstore-test -e PORT=8282 -p 8282:8282 bookstore-management:ci-test
          echo "Waiting for Spring Boot application to bootstrap..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8282/actuator/health | grep '"status":"UP"'; then
              echo "Container health check successfully passed: HTTP 200 UP!"
              docker rm -f bookstore-test
              exit 0
            fi
            echo "Waiting for healthcheck endpoint... ($i/30)"
            sleep 3
          done
          echo "Healthcheck timed out. Displaying container logs:"
          docker logs bookstore-test
          docker rm -f bookstore-test
          exit 1
