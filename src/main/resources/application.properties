spring.application.name=BookstoreManagement
server.port=${PORT:8282}
# Database Configuration
# Defaults to H2 In-Memory database for easy zero-config deployments.
# Can be overridden using environment variables (e.g., SPRING_DATASOURCE_URL) to connect to MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:bookmanager;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Security
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Session Management
server.servlet.session.timeout=30m

# Logging
logging.level.org.springframework=INFO
logging.level.com.book.store=INFO

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.checkoutService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.checkoutService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.checkoutService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.checkoutService.waitDurationInOpenState=10s

# Resilience4j Rate Limiter Config
resilience4j.ratelimiter.instances.checkoutRateLimiter.limitForPeriod=3
resilience4j.ratelimiter.instances.checkoutRateLimiter.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.checkoutRateLimiter.timeoutDuration=500ms

# Redis & Redisson Configuration
spring.autoconfigure.exclude=org.redisson.spring.starter.RedissonAutoConfigurationV2
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Spring Boot Actuator (Cloud Health & Readiness Probes)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always